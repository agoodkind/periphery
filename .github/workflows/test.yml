name: Test
on:
  push:
    branches:
      - master
  pull_request: {}
env:
  MISE_EXPERIMENTAL: 1
  swift_package_resolve: swift package resolve
  swift_build: swift build
  swift_test: swift test
  periphery_scan: ./.build/debug/periphery scan --quiet --clean-build --strict
  cache_version: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  installer:
    name: Installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@master
      - run: bash scripts/test-install.sh
      - name: Check out Homebrew formula
        uses: actions/checkout@v4
        with:
          repository: agoodkind/homebrew-tap
          path: homebrew-tap
          persist-credentials: false
      - name: Test release versioning and signed publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift .github/scripts/release-tests.swift .github/scripts/release.swift homebrew-tap/Formula/periphery.rb
  lint:
    runs-on: macos-26
    name: Lint
    steps:
      - uses: actions/checkout@master
      - uses: jdx/mise-action@v3
        with:
          cache: false
      - run: mise run lint-ci
  macOS:
    name: macOS
    strategy:
      fail-fast: false
      matrix:
        step: ["main-snapshot", "6.4", "6.3", "6.2", "6.1"]
        include:
          - step: "main-snapshot"
            xcode: "26.4"
            swiftly: "main-snapshot"
            continueOnError: true
            macos: "macos-26"
          - step: "6.4"
            xcode: "27.1"
            macos: "xcode-27"
          - step: "6.3"
            xcode: "26.4"
            macos: "macos-26"
          - step: "6.2"
            xcode: "26.3.0"
            macos: "macos-26"
          - step: "6.1"
            xcode: "16.4"
            macos: "macos-15"
    runs-on: ${{ matrix.macos }}
    continue-on-error: ${{ matrix.continueOnError == true }}
    env:
      swift_build: swift build --build-system native
      swift_test: swift test --build-system native
      periphery_scan: ./.build/debug/periphery scan --quiet --clean-build --strict -- --build-system native
    steps:
    - uses: actions/checkout@master
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Install Swiftly
      if: ${{ matrix.swiftly }}
      run: |
        curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
        installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
        ~/.swiftly/bin/swiftly init --skip-install
        . ~/.swiftly/env.sh
        hash -r
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
        echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
    - name: Install Swift (Swiftly)
      if: ${{ matrix.swiftly }}
      run: swiftly install ${{ matrix.swiftly }} --use
    - name: Prepare nightly toolchain for Xcode
      if: ${{ matrix.swiftly }}
      run: |
        TOOLCHAIN_PATH=$(swiftly use --print-location)
        TOOLCHAIN_ID=$(plutil -extract CFBundleIdentifier raw -o - "$TOOLCHAIN_PATH/Info.plist")
        XCODE_LINKER=$(xcrun --toolchain com.apple.dt.toolchain.XcodeDefault --find ld)
        # Remove this link when Swift snapshots include ld: https://github.com/swiftlang/swift/issues/89035
        ln -s "$XCODE_LINKER" "$TOOLCHAIN_PATH/usr/bin/ld"
        printf '%s\n' "$TOOLCHAIN_PATH/usr/bin" >> "$GITHUB_PATH"
        printf 'TOOLCHAINS=%s\n' "$TOOLCHAIN_ID" >> "$GITHUB_ENV"
    - name: Get Swift Version
      id: get-swift-version
      env:
        EXPECTED_SWIFT_VERSION: ${{ matrix.step }}
      run: |
        SWIFT_VERSION=$(swift --version)
        XCRUN_SWIFT_VERSION=$(xcrun swift --version)
        if [[ "$SWIFT_VERSION" != "$XCRUN_SWIFT_VERSION" ]]; then
          printf 'swift and xcrun swift must use the same toolchain\n%s\n%s\n' "$SWIFT_VERSION" "$XCRUN_SWIFT_VERSION" >&2
          exit 1
        fi
        if [[ "$EXPECTED_SWIFT_VERSION" != main-snapshot && "$SWIFT_VERSION" != *"Swift version $EXPECTED_SWIFT_VERSION"* ]]; then
          printf 'Expected Swift %s, received %s\n' "$EXPECTED_SWIFT_VERSION" "$SWIFT_VERSION" >&2
          exit 1
        fi
        printf '%s\n' "$SWIFT_VERSION"
        SWIFT_VERSION=${SWIFT_VERSION%%$'\n'*}
        printf 'SWIFT_VERSION=%s\n' "${SWIFT_VERSION//,/}" >> "$GITHUB_ENV"
        xcodebuild -version
        xcrun --find swift
        xcrun --find ld
      shell: bash
    - name: Cache resolved dependencies
      id: cache-resolved-dependencies
      uses: actions/cache@v4
      with:
        path: |
          .build
          Package.resolved
        key: ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-
    - name: Resolve dependencies
      if: steps.cache-resolved-dependencies.outputs.cache-hit != 'true'
      run: ${{ env.swift_package_resolve }}
    - name: Build
      run: ${{ env.swift_build }}
    - name: Scan
      run: ${{ env.periphery_scan }}
    - name: Test
      run: ${{ env.swift_test }}
  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        swift: ["main-snapshot", "6.3", "6.2", "6.1"]
        include:
          - swift: "main-snapshot"
            container: "swiftlang/swift:nightly-main"
            continueOnError: true
          - swift: "6.3"
            container: "swift:6.3"
          - swift: "6.2"
            container: "swift:6.2"
          - swift: "6.1"
            container: "swift:6.1"
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.continueOnError == true }}
    steps:
    - uses: actions/checkout@master
    - name: Get Swift Version
      id: get-swift-version
      run: |
        swift_version=$(swift -version | head -n 1 | sed s/,//)
        echo "$swift_version"
        echo "SWIFT_VERSION=${swift_version}" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache resolved dependencies
      id: cache-resolved-dependencies
      uses: actions/cache@v4
      with:
        path: |
          .build
          Package.resolved
        key: ${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-
    - name: Resolve dependencies
      if: steps.cache-resolved-dependencies.outputs.cache-hit != 'true'
      run: ${{ env.swift_package_resolve }}
    - name: Build
      run: ${{ env.swift_build }}
    - name: Scan
      run: ${{ env.periphery_scan }} --baseline baselines/linux.json
    - name: Test
      run: ${{ env.swift_test }}
