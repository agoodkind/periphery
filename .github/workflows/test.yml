name: Test
on:
  push:
    branches:
      - master
  pull_request: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  macos:
    name: macOS (Xcode 27.2)
    # The `xcode-27` runner image is a GitHub preview image (runner-images#14404).
    # The "@State macro" retention tests are only conclusive under Xcode 27;
    # on an older Xcode they would not exercise the behaviour they guard.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - name: Lint
        run: |
          mise exec -- swiftformat --lint --quiet .
          mise exec -- swiftlint lint --quiet --strict
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-xcode-27.2-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.2-spm-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
  bazel:
    # Guards the Bazel build: BUILD.bazel lists sources explicitly, so a Swift
    # file missing from `srcs` only fails here. Not verified locally (no bazel).
    name: Bazel
    # Same preview image as the macOS job: `macos-26` jobs waited 15 min for a runner and were
    # cancelled by GitHub (no runner assigned), while `xcode-27` runners start within seconds.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel
        # ~/.cache/bazel is not Bazel's output base on macOS (/private/var/tmp/_bazel_*), so the
        # previous cache never held anything: use an explicit disk + repository cache (.bazelrc, --config=ci).
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-
            ${{ runner.os }}-bazel-
      - name: Build
        run: bazel build --config=ci //:periphery
