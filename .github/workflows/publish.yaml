name: Publish to BCR
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.registry.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check registry version and credential
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag_name }}
          BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: bash .github/scripts/check_bazel.sh
  publish:
    needs: check
    if: needs.check.outputs.exists != 'true'
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.1.0
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: agoodkind/bazel-central-registry
      templates_ref: ${{ github.sha }}
      tag_prefix: ""
      attest: false
      draft: false
    permissions:
      contents: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
