name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 3.8.0-agoodkind.2
      CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
      KEYCHAIN_PATH: ${{ runner.temp }}/release.keychain-db
      NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" != "${VERSION}" ]]; then
            printf 'Release tag %s does not match version %s\n' "${TAG}" "${VERSION}" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${TAG}"
          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]]; then
            printf 'Checked-out commit does not match tag %s\n' "${TAG}" >&2
            exit 1
          fi

      - name: Import signing certificate
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build universal executable
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --scratch-path .build/arm64
          swift build -c release --arch x86_64 --scratch-path .build/x86_64
          mkdir -p release/periphery-${VERSION}
          lipo -create .build/arm64/release/periphery .build/x86_64/release/periphery -output release/periphery-${VERSION}/periphery
          lipo -archs release/periphery-${VERSION}/periphery

      - name: Sign executable and package artifacts
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "release/periphery-${VERSION}/periphery"
          codesign --verify --deep --strict --verbose=2 "release/periphery-${VERSION}/periphery"
          ditto -c -k --sequesterRsrc --keepParent "release/periphery-${VERSION}" "release/periphery-${VERSION}-macos-universal.zip"
          hdiutil create -volname "Periphery ${VERSION}" -srcfolder "release/periphery-${VERSION}" -format UDZO "release/periphery-${VERSION}.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "release/periphery-${VERSION}.dmg"

      - name: Notarize and staple disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          xcrun notarytool submit "release/periphery-${VERSION}.dmg" --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "release/periphery-${VERSION}.dmg"
          xcrun stapler validate "release/periphery-${VERSION}.dmg"
          spctl --assess --type open --context context:primary-signature -v "release/periphery-${VERSION}.dmg"

      - name: Create checksums
        run: |
          set -euo pipefail
          cp scripts/install.sh release/install.sh
          (
            cd release
            shasum -a 256 "periphery-${VERSION}-macos-universal.zip" "periphery-${VERSION}.dmg" install.sh > checksums.txt
          )

      - name: Publish release assets
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create --verify-tag "$TAG" --title "Periphery $VERSION" --generate-notes \
            "release/periphery-${VERSION}-macos-universal.zip" \
            "release/periphery-${VERSION}.dmg" \
            "release/install.sh#install.sh" \
            "release/checksums.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: periphery-${{ env.VERSION }}
          path: |
            release/periphery-${{ env.VERSION }}-macos-universal.zip
            release/periphery-${{ env.VERSION }}.dmg
            release/install.sh
            release/checksums.txt
