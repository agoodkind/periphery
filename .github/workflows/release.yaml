name: Build release artifacts

on:
  push:
    branches: [preserved-free-offline]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry, or leave empty for a new release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: periphery-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Check out release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-tools

      - name: Prepare release version
        id: prepare
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: bash workflow-tools/.github/scripts/prepare_release.sh

      - name: Check published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash workflow-tools/.github/scripts/check_release.sh

      - name: Import signing certificate
        if: steps.published.outputs.exists != 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/release.keychain-db
        run: |
          set -euo pipefail
          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build arm64 executable
        if: steps.published.outputs.exists != 'true'
        env:
          SWIFT_COMMAND: swift
        run: |
          set -euo pipefail
          "$SWIFT_COMMAND" build -c release --arch arm64 --product periphery --scratch-path .build/arm64
          mkdir -p "release/periphery-${VERSION}"
          cp .build/arm64/release/periphery "release/periphery-${VERSION}/periphery"
          SWIFT_PATH=$(xcrun --find swift)
          TOOLCHAIN_USR=$(dirname "$(dirname "$SWIFT_PATH")")
          cp "$TOOLCHAIN_USR/lib/libIndexStore.dylib" "release/periphery-${VERSION}/libIndexStore.dylib"
          test "$(lipo -archs "release/periphery-${VERSION}/periphery")" = "arm64"
          lipo "release/periphery-${VERSION}/libIndexStore.dylib" -verify_arch arm64
          test "$("release/periphery-${VERSION}/periphery" version)" = "$VERSION"

      - name: Sign executable and package artifacts
        if: steps.published.outputs.exists != 'true'
        env:
          ENTITLEMENTS_PATH: release.entitlements
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
          SIGNED_ENTITLEMENTS_PATH: ${{ runner.temp }}/signed-entitlements.plist
          SIGNATURE_DETAILS_PATH: ${{ runner.temp }}/signature-details.txt
        run: |
          set -euo pipefail
          BINARY_PATH="release/periphery-${VERSION}/periphery"
          LIBRARY_PATH="release/periphery-${VERSION}/libIndexStore.dylib"
          ZIP_PATH="release/periphery-${VERSION}-macos-arm64.zip"
          DMG_PATH="release/periphery-${VERSION}-macos-arm64.dmg"
          EXPECTED_TEAM_ID=$(printf '%s' "$SIGNING_IDENTITY" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          if [[ -z "$EXPECTED_TEAM_ID" ]]; then
            printf 'Unable to read Team ID from signing identity\n' >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$LIBRARY_PATH"
          codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS_PATH" --sign "$SIGNING_IDENTITY" "$BINARY_PATH"
          codesign --verify --deep --strict --verbose=2 "$BINARY_PATH"
          codesign --verify --strict --verbose=2 "$LIBRARY_PATH"
          codesign --display --verbose=4 "$BINARY_PATH" 2>&1 | tee "$SIGNATURE_DETAILS_PATH"
          grep -Fq "TeamIdentifier=${EXPECTED_TEAM_ID}" "$SIGNATURE_DETAILS_PATH"
          grep -Eq '^Timestamp=' "$SIGNATURE_DETAILS_PATH"
          grep -Eq '^CodeDirectory .* flags=.*runtime' "$SIGNATURE_DETAILS_PATH"
          codesign --display --entitlements - "$BINARY_PATH" 2>&1 | tee "$SIGNED_ENTITLEMENTS_PATH"
          grep -Fq 'com.apple.security.cs.disable-library-validation' "$SIGNED_ENTITLEMENTS_PATH"
          "$BINARY_PATH" version
          ditto -c -k --sequesterRsrc --keepParent "release/periphery-${VERSION}" "$ZIP_PATH"
          hdiutil create -volname "Periphery ${VERSION}" -srcfolder "release/periphery-${VERSION}" -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"

      - name: Notarize and staple disk image
        if: steps.published.outputs.exists != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
        run: |
          set -euo pipefail
          DMG_PATH="release/periphery-${VERSION}-macos-arm64.dmg"
          printf '%s' "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          xcrun notarytool submit "$DMG_PATH" --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"

      - name: Package Bazel source and create checksums
        if: steps.published.outputs.exists != 'true'
        run: |
          set -euo pipefail
          bash workflow-tools/.github/scripts/package_bazel.sh "$VERSION" release "$PWD"
          cp scripts/install.sh release/install.sh
          (
            cd release
            shasum -a 256 "periphery-${VERSION}-macos-arm64.zip" "periphery-${VERSION}-macos-arm64.dmg" "periphery-bazel-${VERSION}.zip" install.sh > checksums.txt
          )

      - name: Publish release assets
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: bash workflow-tools/.github/scripts/publish_release.sh

      - uses: actions/upload-artifact@v4
        if: steps.published.outputs.exists != 'true'
        with:
          name: periphery-${{ env.VERSION }}
          path: release/*.*

  homebrew:
    needs: build
    runs-on: macos-26
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/download_release.sh

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: agoodkind/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SIGNING_KEY_PATH: ${{ runner.temp }}/homebrew-tap-deploy-key
        run: |
          set -euo pipefail
          trap 'rm -f "$SIGNING_KEY_PATH"' EXIT
          FORMULA_PATH="homebrew-tap/Formula/periphery.rb"
          ZIP_PATH="release/periphery-${VERSION}-macos-arm64.zip"
          ZIP_SHA=$(shasum -a 256 "$ZIP_PATH" | awk '{ print $1 }')
          ruby .github/scripts/update_homebrew_formula.rb "$FORMULA_PATH" "$VERSION" "$ZIP_SHA"
          ruby -c "$FORMULA_PATH"
          printf '%s' "$HOMEBREW_TAP_DEPLOY_KEY" > "$SIGNING_KEY_PATH"
          chmod 600 "$SIGNING_KEY_PATH"
          git -C homebrew-tap config user.name "Periphery release automation"
          git -C homebrew-tap config user.email "noreply@agoodkind.io"
          git -C homebrew-tap config gpg.format ssh
          git -C homebrew-tap config user.signingkey "$SIGNING_KEY_PATH"
          git -C homebrew-tap add Formula/periphery.rb
          if git -C homebrew-tap diff --cached --quiet; then
            printf 'Homebrew formula already matches %s\n' "$VERSION"
            exit 0
          fi
          git -C homebrew-tap commit -S -m "Update Periphery to ${VERSION}"
          git -C homebrew-tap push origin HEAD:main

  bazel:
    needs: build
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ needs.build.outputs.version }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
