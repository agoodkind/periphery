name: Build release artifacts

on:
  push:
    branches: [main, preserved-free-offline]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry, or leave empty for a new release
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: periphery-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    outputs:
      release: ${{ steps.prepare.outputs.release }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          ref: ${{ inputs.tag || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check out release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && github.sha || steps.source.outputs.commit }}
          path: workflow-tools

      - name: Collect published releases and pull request labels
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_INPUT_PATH: ${{ runner.temp }}/release-input.json
        run: swift workflow-tools/.github/scripts/release.swift collect-release-input

      - name: Prepare release version
        id: prepare
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_INPUT_PATH: ${{ runner.temp }}/release-input.json
        run: swift workflow-tools/.github/scripts/release.swift prepare

      - name: Check published release
        id: published
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift workflow-tools/.github/scripts/release.swift check-release

      - name: Import signing certificate
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/release.keychain-db
        run: swift workflow-tools/.github/scripts/release.swift import-certificate

      - name: Create source archive
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        env:
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: swift workflow-tools/.github/scripts/release.swift source-archive

      - uses: bazel-contrib/setup-bazel@9f0750536d239de15c1f8528e2ba6c17a99fb752
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'

      - name: Build arm64 executable
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        env:
          SWIFT_COMMAND: swift
        run: swift workflow-tools/.github/scripts/release.swift build

      - name: Sign executable and package artifacts
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        env:
          ENTITLEMENTS_PATH: release.entitlements
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
          SIGNED_ENTITLEMENTS_PATH: ${{ runner.temp }}/signed-entitlements.plist
          SIGNATURE_DETAILS_PATH: ${{ runner.temp }}/signature-details.txt
        run: swift workflow-tools/.github/scripts/release.swift package

      - name: Notarize and staple disk image
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
        run: swift workflow-tools/.github/scripts/release.swift notarize

      - name: Create checksums
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        run: swift workflow-tools/.github/scripts/release.swift checksums

      - name: Publish release assets
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          RELEASE_INPUT_PATH: ${{ runner.temp }}/release-input.json
        run: swift workflow-tools/.github/scripts/release.swift publish

      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.release == 'true' && steps.published.outputs.exists != 'true'
        with:
          name: periphery-${{ env.VERSION }}
          path: release/*.*

      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.release == 'true'
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input.json
          overwrite: true

  homebrew:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release input
        uses: actions/download-artifact@v4
        with:
          name: release-input
          path: ${{ runner.temp }}

      - name: Download published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift .github/scripts/release.swift download

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: agoodkind/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SIGNING_KEY_PATH: ${{ runner.temp }}/homebrew-tap-deploy-key
          RELEASE_INPUT_PATH: ${{ runner.temp }}/release-input.json
        run: swift .github/scripts/release.swift homebrew
