name: Build release artifacts

on:
  push:
    branches: [preserved-free-offline]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry, or leave empty for a new release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: periphery-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Check out release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-tools

      - name: Prepare release version
        id: prepare
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: swift workflow-tools/.github/scripts/release.swift prepare

      - name: Check published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift workflow-tools/.github/scripts/release.swift check-release

      - name: Import signing certificate
        if: steps.published.outputs.exists != 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/release.keychain-db
        run: swift workflow-tools/.github/scripts/release.swift import-certificate

      - name: Build arm64 executable
        if: steps.published.outputs.exists != 'true'
        env:
          SWIFT_COMMAND: swift
        run: swift workflow-tools/.github/scripts/release.swift build

      - name: Sign executable and package artifacts
        if: steps.published.outputs.exists != 'true'
        env:
          ENTITLEMENTS_PATH: release.entitlements
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
          SIGNED_ENTITLEMENTS_PATH: ${{ runner.temp }}/signed-entitlements.plist
          SIGNATURE_DETAILS_PATH: ${{ runner.temp }}/signature-details.txt
        run: swift workflow-tools/.github/scripts/release.swift package

      - name: Notarize and staple disk image
        if: steps.published.outputs.exists != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
        run: swift workflow-tools/.github/scripts/release.swift notarize

      - name: Create checksums
        if: steps.published.outputs.exists != 'true'
        run: swift workflow-tools/.github/scripts/release.swift checksums

      - name: Publish release assets
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: swift workflow-tools/.github/scripts/release.swift publish

      - uses: actions/upload-artifact@v4
        if: steps.published.outputs.exists != 'true'
        with:
          name: periphery-${{ env.VERSION }}
          path: release/*.*

  homebrew:
    needs: build
    runs-on: macos-26
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift .github/scripts/release.swift download

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: agoodkind/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SIGNING_KEY_PATH: ${{ runner.temp }}/homebrew-tap-deploy-key
        run: swift .github/scripts/release.swift homebrew

  bazel:
    needs: build
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ needs.build.outputs.version }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
